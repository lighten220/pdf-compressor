<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PDF 線上壓縮</title>
  <meta name="description" content="免費線上 PDF 壓縮，檔案只在你的瀏覽器處理，不會上傳到伺服器。支援批次壓縮、極限壓縮與指定目標大小。">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23e5484d'/><text x='16' y='21' font-size='11' font-family='Arial' font-weight='700' fill='white' text-anchor='middle'>PDF</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="wrap">
      <h1>PDF 線上壓縮</h1>
      <p class="sub">檔案只在你的瀏覽器裡處理，<strong>不會上傳</strong>到任何伺服器。</p>
    </div>
  </header>

  <main class="wrap">
    <section class="panel" aria-labelledby="settings-title">
      <h2 id="settings-title">壓縮設定</h2>

      <div class="modes" role="tablist">
        <button class="mode active" data-mode="level" role="tab" aria-selected="true">選擇壓縮等級</button>
        <button class="mode" data-mode="target" role="tab" aria-selected="false">指定目標大小</button>
      </div>

      <div id="mode-level">
        <div class="levels" id="levels"></div>
        <div class="custom" id="custom" hidden>
          <label><span>影像解析度 <output id="dpi-out">120</output> DPI</span>
            <input type="range" id="dpi" min="30" max="300" step="5" value="120">
          </label>
          <label><span>影像品質 <output id="quality-out">60</output>（越低檔案越小）</span>
            <input type="range" id="quality" min="5" max="100" step="5" value="60">
          </label>
        </div>
      </div>

      <div id="mode-target" hidden>
        <label class="target">每個檔案壓到
          <input type="number" id="target-size" min="0.05" step="0.1" value="2">
          <select id="target-unit"><option value="MB">MB</option><option value="KB">KB</option></select>
          以下
        </label>
        <p class="hint">會自動從高品質往下嘗試，選出符合大小且品質最好的結果。</p>
      </div>

      <label class="check"><input type="checkbox" id="grayscale"> 轉為黑白（灰階），可再縮小檔案</label>
    </section>

    <section id="drop" class="drop" tabindex="0">
      <input type="file" id="file-input" accept="application/pdf,.pdf" multiple hidden>
      <div class="drop-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
      </div>
      <p class="drop-title">把 PDF 拖到這裡，或 <button type="button" id="pick" class="link">選擇檔案</button></p>
      <p class="hint">可一次選擇多個檔案</p>
    </section>

    <p id="engine" class="engine" hidden></p>

    <section id="results" class="panel" hidden>
      <div class="results-head">
        <h2>檔案</h2>
        <div class="summary" id="summary"></div>
      </div>
      <ul id="list" class="list"></ul>
      <div class="actions">
        <button id="clear" class="btn ghost">清除全部</button>
        <button id="zip" class="btn primary" disabled>全部下載（ZIP）</button>
      </div>
    </section>

    <footer class="foot">
      壓縮引擎：Ghostscript（AGPL）以 WebAssembly 在瀏覽器執行。首次使用需下載約 16MB 引擎，之後會快取。
    </footer>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
